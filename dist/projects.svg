<svg width="800" height="594" viewBox="0 0 800 594" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .title { font-family: 'Courier New', monospace; font-size: 13px; fill: #0ff; letter-spacing: 2px; }
      .proj-name { font-family: 'Courier New', monospace; font-weight: bold; font-size: 17px; fill: #e6f7ff; }
      .proj-desc { font-family: 'Courier New', monospace; font-size: 12px; fill: #8b949e; }
      .proj-meta { font-family: 'Courier New', monospace; font-size: 11.5px; fill: #7ee787; }
      .footer { font-family: 'Courier New', monospace; font-size: 11px; fill: #484f58; }
    </style>
    <clipPath id="rounded"><rect width="800" height="594" rx="10" ry="10"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="800" height="594" fill="url(#bg)"/>
    <rect width="800" height="594" fill="url(#grid)"/>

    <rect width="800" height="34" fill="#0d1117" fill-opacity="0.85"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="17" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="17" r="5" fill="#27c93f"/>
    <text x="400" y="22" text-anchor="middle" class="title">PROJECTS.SYS — anshxgaur</text>

    <rect x="0" y="0" width="800" height="2" fill="#0ff" opacity="0.5">
      <animate attributeName="y" values="34;594;34" dur="6s" repeatCount="indefinite"/>
    </rect>

    
    <g>
      <rect x="55" y="54" width="690" height="92" rx="6" fill="#0d1117" fill-opacity="0.5" stroke="#0ff" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="55" y="54" width="4" height="92" fill="#0ff" opacity="0.8"/>
      <text x="80" y="78" class="proj-name">Nexus Workspace</text>
      <text y="98" class="proj-desc"><tspan x="80" dy="0">Self-hosted AI-powered corporate workspace with team chat, meetings, live</tspan><tspan x="80" dy="16">transcription, RAG search, and task extraction.</tspan></text>
      <text x="80" y="138" class="proj-meta">FastAPI, React, Tauri, TailwindCSS, Zustand, PostgreSQL, Redis, Qdrant, Whisper,…</text>
    </g>

    <g>
      <rect x="55" y="160" width="690" height="92" rx="6" fill="#0d1117" fill-opacity="0.5" stroke="#0ff" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="55" y="160" width="4" height="92" fill="#0ff" opacity="0.8"/>
      <text x="80" y="184" class="proj-name">VISTA</text>
      <text y="204" class="proj-desc"><tspan x="80" dy="0">Healthcare data intelligence system for EDA, disease prediction, risk</tspan><tspan x="80" dy="16">stratification, and clinical decision support.</tspan></text>
      <text x="80" y="244" class="proj-meta">Python, Pandas, NumPy, Scikit-learn, Streamlit, Matplotlib, Seaborn, ML pipelines</text>
    </g>

    <g>
      <rect x="55" y="266" width="690" height="92" rx="6" fill="#0d1117" fill-opacity="0.5" stroke="#0ff" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="55" y="266" width="4" height="92" fill="#0ff" opacity="0.8"/>
      <text x="80" y="290" class="proj-name">NOVA</text>
      <text y="310" class="proj-desc"><tspan x="80" dy="0">Personal AI assistant architecture focused on local inference, voice interaction,</tspan><tspan x="80" dy="16">security checks, and task orchestration.</tspan></text>
      <text x="80" y="350" class="proj-meta">TypeScript, AI architecture, STT/TTS pipeline, prompt-injection defense, modular…</text>
    </g>

    <g>
      <rect x="55" y="372" width="690" height="92" rx="6" fill="#0d1117" fill-opacity="0.5" stroke="#0ff" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="55" y="372" width="4" height="92" fill="#0ff" opacity="0.8"/>
      <text x="80" y="396" class="proj-name">F1 Data Analytics</text>
      <text y="416" class="proj-desc"><tspan x="80" dy="0">Formula 1 analytics platform for tire degradation, pit-window reasoning, and</tspan><tspan x="80" dy="16">driver performance comparison.</tspan></text>
      <text x="80" y="456" class="proj-meta">TypeScript, Next.js, data visualization, analytics dashboards, strategy modeling</text>
    </g>

    <g>
      <rect x="55" y="478" width="690" height="92" rx="6" fill="#0d1117" fill-opacity="0.5" stroke="#0ff" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="55" y="478" width="4" height="92" fill="#0ff" opacity="0.8"/>
      <text x="80" y="502" class="proj-name">ASTRA</text>
      <text y="522" class="proj-desc"><tspan x="80" dy="0">AI-powered unified search platform merging 1,000 resumes, 20 research papers, and</tspan><tspan x="80" dy="16">6 fragmented data sources into one semantic search + RAG Q&amp;A portal.</tspan></text>
      <text x="80" y="562" class="proj-meta">FastAPI, PostgreSQL + pgvector, fastembed, Groq LLM (text-to-SQL + RAG), Docker</text>
    </g>

    <text x="780" y="584" text-anchor="end" class="footer">5 project(s) tracked</text>
  </g>
</svg>