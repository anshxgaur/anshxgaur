name: Generate Battleship

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically every night at midnight
  workflow_dispatch: # Allows you to click a button to run it manually

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate Battleship Graphic
        run: |
          cat << 'EOF' > ship.py
          import os, json, urllib.request
          username = os.environ.get('GITHUB_REPOSITORY', 'user/repo').split('/')[0]
          url = f"https://api.github.com/users/{username}"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          data = json.loads(urllib.request.urlopen(req).read().decode())
          
          repos = data.get('public_repos', 0)
          followers = data.get('followers', 0)
          hull = 100 + (repos * 10) + (followers * 5)
          
          if hull < 200:
              color, ship = "#58a6ff", "Scout Fighter 🛸"
          elif hull < 400:
              color, ship = "#d2a8ff", "Heavy Cruiser 🚀"
          else:
              color, ship = "#ff7b72", "Command Dreadnought 🛰️"
          
          bar_width = min(410, (hull/500)*410)
          svg = f'''
