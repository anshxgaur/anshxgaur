name: Generate Battleship

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: |
          pip install pillow

      - name: Generate Battleship
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          cat << 'PYTHON' > generate_battleship.py

          import os
          import json
          import urllib.request
          from PIL import Image, ImageDraw, ImageFont

          # ==========================================
          # GITHUB USER
          # ==========================================

          username = "anshxgaur"

          # ==========================================
          # GET LIVE GITHUB DATA
          # ==========================================

          url = f"https://api.github.com/users/{username}"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "GitHub-Battleship",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.loads(response.read().decode())

          repos = data.get("public_repos", 0)
          followers = data.get("followers", 0)

          # ==========================================
          # CALCULATE SHIP POWER
          # ==========================================

          hull = 100 + (repos * 10) + (followers * 5)

          max_hull = 500
          hull_display = min(hull, max_hull)

          if hull < 200:
              ship_class = "SCOUT FRIGATE"
          elif hull < 400:
              ship_class = "HEAVY CRUISER"
          else:
              ship_class = "COMMAND DREADNOUGHT"

          # ==========================================
          # LOAD CINEMATIC SHIP IMAGE
          # ==========================================

          image = Image.open("battleship-base.png").convert("RGBA")

          draw = ImageDraw.Draw(image)

          # ==========================================
          # FONTS
          # ==========================================

          font_small = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
              28
          )

          font_medium = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
              38
          )

          font_large = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              48
          )

          font_huge = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              64
          )

          # ==========================================
          # UPDATE COMMANDER DATA
          # ==========================================

          # Cover the old commander panel
          draw.rounded_rectangle(
              (55, 175, 495, 445),
              radius=18,
              fill=(2, 10, 25, 235),
              outline=(40, 130, 255, 255),
              width=3
          )

          draw.text(
              (85, 205),
              "COMMANDER",
              font=font_small,
              fill=(145, 180, 230)
          )

          draw.text(
              (85, 245),
              username,
              font=font_large,
              fill="white"
          )

          # ==========================================
          # REPOSITORIES
          # ==========================================

          draw.text(
              (85, 330),
              str(repos),
              font=font_huge,
              fill=(80, 170, 255)
          )

          draw.text(
              (155, 350),
              "REPOSITORIES",
              font=font_small,
              fill=(160, 190, 225)
          )

          # ==========================================
          # FOLLOWERS
          # ==========================================

          draw.text(
              (300, 330),
              str(followers),
              font=font_huge,
              fill=(190, 150, 255)
          )

          draw.text(
              (370, 350),
              "FOLLOWERS",
              font=font_small,
              fill=(160, 190, 225)
          )

          # ==========================================
          # HULL STRENGTH
          # ==========================================

          # Cover old hull bar
          draw.rounded_rectangle(
              (55, 730, 610, 805),
              radius=20,
              fill=(5, 18, 40, 245)
          )

          draw.text(
              (55, 685),
              "HULL STRENGTH",
              font=font_medium,
              fill=(150, 190, 230)
          )

          # Background bar
          bar_x = 55
          bar_y = 745
          bar_width = 555
          bar_height = 32

          draw.rounded_rectangle(
              (bar_x, bar_y,
               bar_x + bar_width,
               bar_y + bar_height),
              radius=16,
              fill=(30, 55, 90)
          )

          # Filled bar
          filled_width = int(
              bar_width * hull_display / max_hull
          )

          if filled_width > 0:
              draw.rounded_rectangle(
                  (bar_x, bar_y,
                   bar_x + filled_width,
                   bar_y + bar_height),
                  radius=16,
                  fill=(30, 210, 255)
              )

          draw.text(
              (640, 738),
              f"{hull_display} / {max_hull} HP",
              font=font_medium,
              fill=(80, 200, 255)
          )

          # ==========================================
          # SHIP CLASS
          # ==========================================

          # Cover old ship class panel
          draw.rounded_rectangle(
              (1200, 720, 1605, 870),
              radius=20,
              fill=(2, 10, 25, 235),
              outline=(40, 130, 255, 255),
              width=3
          )

          draw.text(
              (1230, 745),
              "SHIP CLASS",
              font=font_small,
              fill=(145, 180, 230)
          )

          draw.text(
              (1230, 790),
              ship_class,
              font=font_medium,
              fill=(90, 180, 255)
          )

          # ==========================================
          # STATUS
          # ==========================================

          draw.text(
              (1230, 835),
              "ACTIVE • PATROLLING",
              font=font_small,
              fill=(100, 220, 255)
          )

          # ==========================================
          # SAVE
          # ==========================================

          image.save(
              "battleship.png",
              "PNG",
              optimize=True
          )

          print("===================================")
          print("GITHUB BATTLESHIP GENERATED")
          print("===================================")
          print(f"Commander : {username}")
          print(f"Repos     : {repos}")
          print(f"Followers : {followers}")
          print(f"Hull      : {hull_display}/{max_hull}")
          print(f"Class     : {ship_class}")
          print("===================================")

          PYTHON

          python generate_battleship.py

      - name: Commit Battleship
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add battleship.png

          git commit -m "Update GitHub Battleship" || exit 0

          git pull --rebase origin main

          git push origin main
