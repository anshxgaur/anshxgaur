name: Generate Battleship

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Generate Battleship Graphic
        run: |
          cat << 'EOF' > ship.py
          import os
          import json
          import urllib.request

          username = "anshxgaur"

          url = f"https://api.github.com/users/{username}"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          data = json.loads(
              urllib.request.urlopen(req).read().decode()
          )

          repos = data.get("public_repos", 0)
          followers = data.get("followers", 0)

          hull = 100 + (repos * 10) + (followers * 5)

          if hull < 200:
              color, ship = "#58a6ff", "Scout Fighter 🛸"
          elif hull < 400:
              color, ship = "#d2a8ff", "Heavy Cruiser 🚀"
          else:
              color, ship = "#ff7b72", "Command Dreadnought 🛰️"

          bar_width = min(410, (hull / 500) * 410)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="500" height="220" viewBox="0 0 500 220">
            <rect width="500" height="220" rx="15" fill="#0d1117"/>
            
            <text x="250" y="40"
                  text-anchor="middle"
                  fill="#ffffff"
                  font-size="24"
                  font-family="Arial"
                  font-weight="bold">
              ⚔️ GITHUB BATTLESHIP
            </text>

            <text x="250" y="75"
                  text-anchor="middle"
                  fill="{color}"
                  font-size="20"
                  font-family="Arial"
                  font-weight="bold">
              {ship}
            </text>

            <text x="45" y="115"
                  fill="#8b949e"
                  font-size="14"
                  font-family="Arial">
              HULL STRENGTH
            </text>

            <rect x="45" y="130" width="410" height="25"
                  rx="12"
                  fill="#21262d"/>

            <rect x="45" y="130" width="{bar_width}" height="25"
                  rx="12"
                  fill="{color}"/>

            <text x="250" y="180"
                  text-anchor="middle"
                  fill="#ffffff"
                  font-size="15"
                  font-family="Arial">
              {repos} repositories • {followers} followers • Hull: {hull}
            </text>
          </svg>'''

          with open("battleship.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          EOF

      - name: Run Battleship Generator
        run: python ship.py

      - name: Commit Battleship Graphic
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add battleship.svg
          git commit -m "Update battleship" || exit 0
          git push
