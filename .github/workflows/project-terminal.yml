name: Generate Project Terminal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # refreshes daily at 3:00 AM UTC (pinned repos rarely change)

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project showcase SVG
        env:
          GITHUB_USER_NAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-projects.mjs

      - name: Commit and push generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/projects.svg
          git diff --staged --quiet || git commit -m "Update project terminal"
          git push
