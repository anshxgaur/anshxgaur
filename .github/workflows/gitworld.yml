name: Generate GitWorld

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitWorld SVG
        uses: Dasmat13/git-world-action@main
        with:
          github_user_name: ${{ github.actor }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          svg_out_path: dist/gitworld.svg

      - name: Commit and push generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/gitworld.svg
          git diff --staged --quiet || git commit -m "Update GitWorld animation"
          git push
